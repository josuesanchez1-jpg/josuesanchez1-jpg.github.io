<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Cámara</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .camera-container { position: relative; width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video { width: 100%; height: auto; display: block; }
        .controls { margin-top: 20px; display: flex; gap: 10px; width: 100%; max-width: 400px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #btnCapturar { background: #007bff; color: white; }
        #btnCapturar:hover { background: #0056b3; }
        #btnCapturar:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9em; color: #333; word-break: break-all; text-align: center; }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>Capturar Documento/Foto</h2>
    
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    
    <div class="controls">
        <button id="btnCapturar">Tomar Foto y Subir</button>
    </div>
    
    <div id="status">Esperando cámara...</div>
    <canvas id="canvas"></canvas>

    <script>
        // REEMPLAZA ESTO CON LA URL DE TU WEB APP DE APPS SCRIPT
        const SCRIPT_URL = 'https://script.google.com/a/macros/holcim.com/s/AKfycbzYEmgF389cdBUjC6Eg0i0fxbcA-RoSVi7axSzZjSKrHteASQC2BAK3ZpOrdwWE4Y0b/exec';
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCapturar = document.getElementById('btnCapturar');
        const statusDiv = document.getElementById('status');
        
        // Iniciar la cámara (preferiblemente la trasera para logística/documentos)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                video.srcObject = stream;
                statusDiv.innerText = "Cámara lista.";
            })
            .catch(err => {
                console.error("Error al acceder a la cámara:", err);
                statusDiv.innerText = "Error: Permisos de cámara denegados o dispositivo no encontrado.";
                btnCapturar.disabled = true;
            });

        btnCapturar.addEventListener('click', async () => {
            btnCapturar.disabled = true;
            statusDiv.innerText = "Capturando...";
            
            // Ajustar el canvas al tamaño del video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            
            // Dibujar el frame actual en el canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Obtener el Base64 (comprimido como JPEG al 80% para optimizar subida)
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            
            statusDiv.innerText = "Subiendo a Google Drive...";

            try {
                // Se envía como text/plain para evadir el preflight OPTIONS de CORS
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify({ image: base64Image })
                });

                const result = await response.json();
                
                if(result.status === 'success') {
                    statusDiv.innerHTML = `✅ Éxito! <a href="${result.fileUrl}" target="_blank">Ver Archivo</a>`;
                } else {
                    statusDiv.innerText = "❌ Error en el servidor: " + result.message;
                }
            } catch (error) {
                console.error("Error de fetch:", error);
                statusDiv.innerText = "❌ Error de conexión al subir la imagen.";
            } finally {
                btnCapturar.disabled = false;
            }
        });
    </script>
</body>
</html>
