<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura de Cámara a Google Drive</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
    h2 { margin-top: 0; color: #333; }
    .btn { background-color: #1a73e8; color: white; border: none; padding: 12px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 6px 2px; transition: background 0.2s; }
    .btn:hover { background-color: #1557b0; }
    .btn-success { background-color: #34a853; }
    .btn-success:hover { background-color: #2d8e47; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    video, canvas, img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 8px; margin-top: 15px; background: #000; }
    #status { margin-top: 15px; font-size: 14px; font-weight: 500; word-break: break-all; }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
    input[type="file"] { display: none; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 15px; }
    .actions .btn { flex: 1 1 145px; min-height: 48px; margin: 0; }
    @media (max-width: 480px) {
      body { padding: 12px; min-height: 100vh; }
      .card { padding: 18px; }
      video, canvas, img { max-height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Captura de Foto</h2>
    <p>Abre la cámara o sube una imagen para guardarla en Google Drive.</p>

    <!-- Visor de cámara -->
    <video id="video" autoplay playsinline muted style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview" style="display:none;" alt="Vista previa">

    <div class="actions">
      <button id="btnActivarCamara" class="btn" onclick="iniciarCamara()">Abrir Cámara</button>
      <button id="btnTomarFoto" class="btn btn-success" onclick="capturarFoto()" style="display:none;">Capturar</button>

      <label for="inputNativo" class="btn btn-success" style="display:inline-block;">
        Galería / Sistema
      </label>
      <input type="file" id="inputNativo" accept="image/*" capture="environment" onchange="cargarDesdeArchivo(event)">
    </div>

    <button id="btnGuardar" class="btn btn-success" onclick="enviarAGoogleDrive()" style="display:none; width: 100%; margin-top: 15px;">
      Guardar en Drive
    </button>

    <div id="status"></div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRM8eLrbgWtdJimxWqVFaThV9-9jSRocnm6K9SGiDRAiPyY9EyA0v0dgQn5sfmM7NVEg/exec";

    let base64Foto = "";
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const statusDiv = document.getElementById('status');
    const btnActivarCamara = document.getElementById('btnActivarCamara');
    const btnTomarFoto = document.getElementById('btnTomarFoto');
    const btnGuardar = document.getElementById('btnGuardar');
    const MAX_IMAGE_WIDTH = 320;
    const MAX_IMAGE_HEIGHT = 240;
    let cameraStream = null;

    function detenerCamara() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      video.pause();
      video.srcObject = null;
      video.style.display = 'none';
      btnActivarCamara.style.display = 'inline-block';
      btnTomarFoto.style.display = 'none';
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && cameraStream) {
        detenerCamara();
        statusDiv.className = '';
        statusDiv.innerText = 'Cámara detenida al salir de la página. Pulsa Abrir Cámara para reanudar.';
      }
    });
    window.addEventListener('pagehide', detenerCamara);

    async function iniciarCamara() {
      if (!window.isSecureContext) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'La cámara requiere HTTPS. Abre la página con una dirección https:// o usa Galería / Sistema.';
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDiv.className = 'error';
        statusDiv.innerText = 'Este navegador no permite abrir la cámara desde la página. Usa Galería / Sistema.';
        return;
      }

      try {
        statusDiv.className = '';
        statusDiv.innerText = 'Solicitando acceso a la cámara...';

        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: MAX_IMAGE_WIDTH, max: MAX_IMAGE_WIDTH },
              height: { ideal: MAX_IMAGE_HEIGHT, max: MAX_IMAGE_HEIGHT },
              frameRate: { ideal: 15, max: 15 }
            },
            // No se solicita micrófono ni se ejecuta procesamiento de audio.
            audio: false
          });
        } catch (cameraError) {
          if (cameraError.name !== 'OverconstrainedError') throw cameraError;

          // Si el navegador rechaza las restricciones, deja que elija el flujo de cámara predeterminado.
          statusDiv.innerText = 'Probando el flujo de cámara predeterminado...';
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        }

        video.srcObject = cameraStream;
        video.style.display = 'block';
        await video.play();
        btnActivarCamara.style.display = 'none';
        btnTomarFoto.style.display = 'inline-block';
        statusDiv.innerText = '';
      } catch (err) {
        detenerCamara();
        statusDiv.className = 'error';
        statusDiv.innerText = 'No se pudo iniciar la cámara (' + err.name + '). Revisa los permisos o usa Galería / Sistema.';
      }
    }

    function procesarImagen(source, width, height) {
      const scale = Math.min(MAX_IMAGE_WIDTH / width, MAX_IMAGE_HEIGHT / height, 1);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);

      base64Foto = canvas.toDataURL('image/jpeg', 0.8);
      preview.src = base64Foto;
      preview.style.display = 'block';
      btnGuardar.style.display = 'block';
    }

    function capturarFoto() {
      const width = video.videoWidth || 640;
      const height = video.videoHeight || 480;
      procesarImagen(video, width, height);
      
      detenerCamara();
    }

    function cargarDesdeArchivo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const image = new Image();
        image.onload = function() {
          procesarImagen(image, image.naturalWidth, image.naturalHeight);
          video.style.display = 'none';
          btnActivarCamara.style.display = 'inline-block';
          btnTomarFoto.style.display = 'none';
        };
        image.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function enviarAGoogleDrive() {
      if (!base64Foto) return;

      btnGuardar.disabled = true;
      statusDiv.className = '';
      statusDiv.innerText = 'Subiendo a Google Drive...';

      const payload = {
        base64: base64Foto,
        nombre: 'Foto_GitHub_' + new Date().getTime() + '.jpg'
      };

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const res = await response.json();
        btnGuardar.disabled = false;

        if (res.exito) {
          statusDiv.className = 'success';
          statusDiv.innerHTML = '¡Foto guardada!<br><a href="' + res.url + '" target="_blank">Ver en Google Drive</a>';
        } else {
          statusDiv.className = 'error';
          statusDiv.innerText = 'Error: ' + res.error;
        }
      } catch (err) {
        btnGuardar.disabled = false;
        statusDiv.className = 'error';
        statusDiv.innerText = 'Error de conexión: ' + err.message;
      }
    }
  </script>
</body>
</html>
